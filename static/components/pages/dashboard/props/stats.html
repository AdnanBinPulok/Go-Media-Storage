<section class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4 lg:gap-5">
    <article
        class="rounded-2xl border border-white/10 bg-background/60 p-4 shadow-sm backdrop-blur-sm transition-all hover:border-highlight/20 hover:shadow-lg hover:shadow-highlight/5">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-muted">User Plan Limit</span>
            <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-highlight/10 text-highlight">
                <i class="fas fa-shield-halved text-xs"></i>
            </div>
        </div>
        <p id="dashboard-stat-user-limit" class="mt-3 text-2xl font-bold text-text-secondary">Loading...</p>
        <p id="dashboard-stat-user-limit-note" class="mt-1 text-xs text-muted">Checking plan capacity</p>
    </article>

    <article
        class="rounded-2xl border border-white/10 bg-background/60 p-4 shadow-sm backdrop-blur-sm transition-all hover:border-highlight/20 hover:shadow-lg hover:shadow-highlight/5">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-muted">Vault Allocation</span>
            <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-warning/10 text-warning">
                <i class="fas fa-layer-group text-xs"></i>
            </div>
        </div>
        <p id="dashboard-stat-allocated" class="mt-3 text-2xl font-bold text-text-secondary">Loading...</p>
        <div class="mt-2 text-xs">
            <div class="flex items-center justify-between text-muted">
                <span id="dashboard-stat-allocated-note">Checking allocation</span>
                <span id="dashboard-stat-allocated-percent" class="font-semibold text-warning">0%</span>
            </div>
            <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-secondary/50">
                <div id="dashboard-stat-allocated-bar" class="h-full w-0 rounded-full bg-warning transition-all"></div>
            </div>
        </div>
    </article>

    <article
        class="rounded-2xl border border-white/10 bg-background/60 p-4 shadow-sm backdrop-blur-sm transition-all hover:border-highlight/20 hover:shadow-lg hover:shadow-highlight/5">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-muted">Actual Usage</span>
            <div id="dashboard-stat-used-icon"
                class="flex h-8 w-8 items-center justify-center rounded-xl bg-success/10 text-success">
                <i class="fas fa-hard-drive text-xs"></i>
            </div>
        </div>
        <p id="dashboard-stat-used" class="mt-3 text-2xl font-bold text-text-secondary">Loading...</p>
        <div class="mt-2 text-xs">
            <div class="flex items-center justify-between text-muted">
                <span id="dashboard-stat-used-note">Checking used storage</span>
                <span id="dashboard-stat-used-percent" class="font-semibold text-success">0%</span>
            </div>
            <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-secondary/50">
                <div id="dashboard-stat-used-bar" class="h-full w-0 rounded-full bg-success transition-all"></div>
            </div>
        </div>
    </article>

    <article
        class="rounded-2xl border border-white/10 bg-background/60 p-4 shadow-sm backdrop-blur-sm transition-all hover:border-highlight/20 hover:shadow-lg hover:shadow-highlight/5">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase tracking-wider text-muted">Storage Allocation</span>
            <div id="dashboard-stat-storage-health-icon"
                class="flex h-8 w-8 items-center justify-center rounded-xl bg-success/10 text-success">
                <i class="fas fa-server text-xs"></i>
            </div>
        </div>
        <p id="dashboard-stat-storage-health" class="mt-3 text-2xl font-bold text-text-secondary">Loading...</p>
        <div class="mt-2 text-xs">
            <div class="flex items-center justify-between text-muted">
                <span id="dashboard-stat-storage-health-note">Checking allocation</span>
                <span id="dashboard-stat-storage-health-percent" class="font-semibold text-success">0%</span>
            </div>
            <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-secondary/50">
                <div id="dashboard-stat-storage-health-bar" class="h-full w-0 rounded-full bg-success transition-all">
                </div>
            </div>
        </div>
    </article>
</section>

<script>
    let dashboardStatsCache = {}

    function ratio(numerator, denominator) {
        if (!denominator || denominator <= 0) return 0;
        return Math.min((numerator / denominator) * 100, 100);
    }

    function setText(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
    }

    function setBar(id, percent) {
        const el = document.getElementById(id);
        if (el) el.style.width = Math.max(0, Math.min(percent, 100)).toFixed(1) + '%';
    }

    function renderDashboardStats(stats) {
        if (!stats || !stats.storage || !stats.vault) return;

        const storageLimit = Number(stats.storage.limit || 0);
        const storageAvailable = Number(stats.storage.available || 0);
        const storageUsed = Number(stats.storage.used || 0);
        const storageUsedPercentage = Number(stats.storage.used_percentage || ratio(storageUsed, storageLimit));

        const vaultAvailable = Number(stats.vault.available || 0);
        const vaultsAllocated = Number(stats.vault.allocated || 0);
        const vaultLimit = Number(stats.vault.limit || 0);
        const vaultAllocationPercent = Number(stats.vault.allocated_percentage || ratio(vaultsAllocated, vaultLimit));

        // User Plan Limit
        setText('dashboard-stat-user-limit', storageLimit > 0 ? formatBytes(storageLimit) : 'Unlimited');
        setText('dashboard-stat-user-limit-note', storageLimit > 0
            ? `${formatBytes(Math.max(storageAvailable, 0))} available`
            : 'No storage plan limit');

        // Vault Allocation
        setText('dashboard-stat-allocated', `${vaultsAllocated} / ${vaultLimit}`);
        setText('dashboard-stat-allocated-note', `${Math.max(vaultAvailable, 0)} vault slots left`);
        setText('dashboard-stat-allocated-percent', `${vaultAllocationPercent.toFixed(1)}%`);
        setBar('dashboard-stat-allocated-bar', vaultAllocationPercent);

        // Actual Usage
        setText('dashboard-stat-used', formatBytes(storageUsed));
        setText('dashboard-stat-used-note', `${formatBytes(Math.max(storageAvailable, 0))} remaining`);
        setText('dashboard-stat-used-percent', `${storageUsedPercentage.toFixed(2)}%`);
        setBar('dashboard-stat-used-bar', storageUsedPercentage);

        // Storage Allocation (replaces Vault Health)
        const storageAllocated = Number(stats.storage.allocated || 0);
        const storageAllocationPercent = Number(stats.storage.allocated_percentage || ratio(storageAllocated, storageLimit));

        setText('dashboard-stat-storage-health', formatBytes(storageAllocated));
        setText('dashboard-stat-storage-health-note', `Allocated vs Limit`);
        setText('dashboard-stat-storage-health-percent', `${storageAllocationPercent.toFixed(2)}%`);
        setBar('dashboard-stat-storage-health-bar', storageAllocationPercent);

        let stateColor = 'success';
        if (storageUsedPercentage >= 95) {
            stateColor = 'danger';
        } else if (storageUsedPercentage >= 80) {
            stateColor = 'warning';
        }

        let allocStateColor = 'success';
        if (storageAllocationPercent >= 95) {
            allocStateColor = 'danger';
        } else if (storageAllocationPercent >= 80) {
            allocStateColor = 'warning';
        }

        // Update UI Colors dynamically
        const applyColor = (id, classTemplate) => {
            const el = document.getElementById(id);
            if (el) {
                // Remove existing color classes
                el.className = el.className.replace(/\b(bg|text)-(success|warning|danger)(?:\/10)?\b/g, '').replace(/\s+/g, ' ').trim();
                // Add new ones
                classTemplate.split(' ').forEach(cls => {
                    if (cls) el.classList.add(cls);
                });
            }
        };

        applyColor('dashboard-stat-used-icon', `bg-${stateColor}/10 text-${stateColor}`);
        applyColor('dashboard-stat-used-percent', `text-${stateColor}`);
        applyColor('dashboard-stat-used-bar', `bg-${stateColor}`);

        applyColor('dashboard-stat-storage-health-icon', `bg-${allocStateColor}/10 text-${allocStateColor}`);
        applyColor('dashboard-stat-storage-health-percent', `text-${allocStateColor}`);
        applyColor('dashboard-stat-storage-health-bar', `bg-${allocStateColor}`);
    }

    async function fetchDashboardStats() {
        try {
            const response = await fetch('/api/dashboard/stats');
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.error || result.message || 'Failed to load dashboard stats');
            }
            dashboardStatsCache = result.stats || {};
            renderDashboardStats(dashboardStatsCache);
        } catch (error) {
            console.error('Error fetching dashboard stats:', error);
            showNotification('Failed to load dashboard stats. Please try again later.', 'error');
            renderDashboardStats({});
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchDashboardStats();
    });

</script>
