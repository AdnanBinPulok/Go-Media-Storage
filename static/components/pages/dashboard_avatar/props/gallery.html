<section class="flex flex-col overflow-hidden rounded-lg border border-white/10 bg-secondary/10">
    <div class="flex items-center justify-between gap-2 border-b border-white/10 bg-secondary/30 px-3 py-2">
        <div class="flex items-center gap-1.5">
            <i class="fas fa-images text-[11px] text-accent"></i>
            <h3 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-muted">Variants</h3>
        </div>
        <button type="button" onclick="shuffleAvatarGallery()" title="Shuffle"
            class="flex items-center gap-1 rounded-md border border-white/10 bg-secondary/50 px-1.5 py-0.5 text-[10px] font-medium text-muted transition-colors hover:border-highlight/30 hover:text-text-secondary">
            <i class="fas fa-random text-[9px]"></i> Shuffle
        </button>
    </div>

    <div id="avatar-gallery" class="grid flex-1 grid-cols-4 content-start gap-1.5 p-2">
        <!-- tiles injected by shuffleAvatarGallery() -->
    </div>

    <p class="border-t border-white/10 px-3 py-1.5 text-[10px] text-muted">
        Click a tile to load it into the preview.
    </p>
</section>
