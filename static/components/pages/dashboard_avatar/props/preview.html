<section class="flex flex-col overflow-hidden rounded-lg border border-white/10 bg-secondary/10">
    <div class="flex items-center justify-between gap-2 border-b border-white/10 bg-secondary/30 px-3 py-2">
        <div class="flex items-center gap-1.5">
            <i class="fas fa-image text-[11px] text-accent"></i>
            <h3 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-muted">Preview</h3>
        </div>
        <span id="avatar-preview-meta"
            class="rounded bg-secondary/60 px-1.5 py-0.5 text-[10px] font-medium tabular-nums text-muted">—</span>
    </div>

    <div class="flex flex-1 flex-col gap-3 p-3 sm:flex-row sm:items-start">
        <div class="avatar-checker shrink-0 self-center rounded-lg border border-white/10 p-1 sm:self-start">
            <img id="avatar-image" alt="Generated avatar" width="160" height="160"
                class="h-auto w-32 rounded sm:w-36 md:w-40" />
        </div>

        <div class="flex min-w-0 flex-1 flex-col gap-2">
            <div class="flex items-center gap-1.5">
                <input id="avatar-request-url" type="text" readonly spellcheck="false"
                    class="min-w-0 flex-1 rounded-md border border-white/10 bg-background/60 px-2 py-1.5 font-mono text-[10px] text-text-secondary outline-none"
                    value="—" />
                <button type="button" onclick="copyAvatarURL()" title="Copy URL"
                    class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-white/10 bg-secondary/50 text-muted transition-colors hover:border-highlight/30 hover:text-text-secondary">
                    <i class="fas fa-copy text-[10px]"></i>
                </button>
            </div>

            <dl class="grid grid-cols-[auto_minmax(0,1fr)] items-baseline gap-x-2 gap-y-1 text-[10px]">
                <dt class="text-muted">UUID</dt>
                <dd id="avatar-meta-uuid" class="truncate font-mono text-text-secondary" title="">—</dd>
                <dt class="text-muted">Size</dt>
                <dd id="avatar-meta-size" class="font-mono tabular-nums text-text-secondary">—</dd>
                <dt class="text-muted">Background</dt>
                <dd class="text-text-secondary">transparent (5% padding)</dd>
            </dl>

            <p class="mt-auto text-[10px] leading-relaxed text-muted">
                <i class="fas fa-circle-notch mr-1 text-highlight/60"></i>
                Same UUID and size always produce byte-identical PNGs.
            </p>
        </div>
    </div>
</section>
