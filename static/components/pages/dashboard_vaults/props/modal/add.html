<script>
    function openAddVaultModal() {
        const existingModal = document.getElementById('addVaultModal');
        if (existingModal) {
            existingModal.remove();
        }

        console.log("Opening Add Vault Modal");

        const modal = document.createElement('div');
        modal.id = 'addVaultModal';
        modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4';
        modal.innerHTML = `
            <div id="addVaultModalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-[2px]" onclick="closeModal('addVaultModal')"></div>

            <div class="relative w-full max-w-lg overflow-hidden rounded-2xl border border-white/10 bg-secondary/95 shadow-2xl">
                <div class="flex items-center justify-between border-b border-white/10 px-5 py-4">
                    <div>
                        <h2 class="text-base font-semibold text-text-secondary">Create New Vault</h2>
                        <p class="mt-0.5 text-xs text-muted">Add a vault to securely manage API credentials.</p>
                    </div>
                    <button type="button" id="addVaultModalCloseBtn" onclick="closeModal('addVaultModal')"
                        class="flex h-8 w-8 items-center justify-center rounded-lg border border-white/10 bg-background/50 text-muted transition-all hover:border-danger/40 hover:bg-danger/10 hover:text-danger"
                        aria-label="Close add vault modal">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>

                <form id="addVaultForm" class="space-y-4 px-5 py-4" onsubmit="handleAddVaultSubmit(event)">
                    <div>
                        <label for="addVaultName" class="block text-xs font-semibold uppercase tracking-wide text-muted">Vault Name</label>
                        <input id="addVaultName" name="name" type="text" required maxlength="120" placeholder="e.g. Production Vault"
                            class="mt-2 w-full rounded-lg border border-white/10 bg-background/70 px-3.5 py-2.5 text-sm text-text-secondary outline-none transition-all placeholder:text-muted/70 focus:border-highlight/50 focus:bg-background" />
                    </div>
                    <div>
                        <label for="addVaultMaxStorage" class="block text-xs font-semibold uppercase tracking-wide text-muted">Max Storage Capacity</label>
                        <input id="addVaultMaxStorage" name="max_storage" type="text" placeholder="e.g. 1GB, 500MB (leave empty for unlimited)"
                            class="mt-2 w-full rounded-lg border border-white/10 bg-background/70 px-3.5 py-2.5 text-sm text-text-secondary outline-none transition-all placeholder:text-muted/70 focus:border-highlight/50 focus:bg-background" />
                    </div>
                    <label class="flex items-center gap-2.5 rounded-lg border border-white/10 bg-background/40 px-3.5 py-2.5">
                        <input id="addVaultIsActive" name="is_active" type="checkbox"
                            class="h-4 w-4 rounded border-white/20 bg-background text-highlight focus:ring-highlight" checked>
                        <span class="text-sm text-text-secondary">Set this vault as active</span>
                    </label>
                </form>

                <div class="flex items-center justify-end gap-2 border-t border-white/10 px-5 py-4">
                    <button type="button" id="addVaultCancelBtn" onclick="closeModal('addVaultModal')"
                        class="rounded-xl border border-white/10 bg-background/60 px-4 py-2 text-sm font-medium text-text-secondary transition-all hover:border-white/20 hover:bg-background">
                        Cancel
                    </button>
                    <button type="submit" form="addVaultForm" id="addVaultSubmitBtn"
                        class="rounded-xl bg-btn-primary px-4 py-2 text-sm font-semibold text-btn-primary-text shadow-lg shadow-btn-primary/20 transition-all hover:shadow-xl hover:shadow-btn-primary/30 disabled:cursor-not-allowed disabled:opacity-50">
                        Create Vault
                    </button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);
        const nameInput = document.getElementById('addVaultName');
        if (nameInput) {
            nameInput.focus();
        }
    }


    async function handleAddVaultSubmit(event) {
        event.preventDefault();

        const nameInput = document.getElementById('addVaultName');
        const isActiveInput = document.getElementById('addVaultIsActive');
        const maxStorageInput = document.getElementById('addVaultMaxStorage');

        if (!nameInput) {
            console.error("Add Vault Modal: Name input not found");
            return;
        }

        let maxStorageBytes = 0;
        if (maxStorageInput && maxStorageInput.value.trim() !== '') {
            const match = maxStorageInput.value.trim().match(/^([\d.]+)\s*(KB|MB|GB|TB|PB|B)?$/i);
            if (!match) {
                showPopupNotification('Invalid storage format for Max Storage. Use values like 1GB, 500MB, etc.', 'warning');
                return;
            }
            const val = parseFloat(match[1]);
            const unit = match[2] ? match[2].toUpperCase() : 'B';
            const multipliers = { 'B': 1, 'KB': 1024, 'MB': Math.pow(1024, 2), 'GB': Math.pow(1024, 3), 'TB': Math.pow(1024, 4), 'PB': Math.pow(1024, 5) };
            maxStorageBytes = Math.floor(val * multipliers[unit]);
        }

        const vaultData = {
            name: nameInput.value.trim(),
            is_active: isActiveInput ? isActiveInput.checked : false,
            storage_bytes_limit: maxStorageBytes
        };

        const AddVaultSubmitBtn = document.getElementById('addVaultSubmitBtn');
        const originalButtonOriginalContent = AddVaultSubmitBtn.innerHTML;
        AddVaultSubmitBtn.innerHTML = `<i class="fas fa-spinner animate-spin text-sm"></i>`;
        AddVaultSubmitBtn.disabled = true;

        try {
            const response = await fetch('/api/vaults/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vaultData)
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.error || result.message || 'Failed to create vault');
            }

            closeModal('addVaultModal');
            refreshVaults(false);
            showNotification('Vault created successfully!', 'success', 1000);
        } catch (error) {
            console.error("Network error while creating vault:", error);
            showPopupNotification(error.message || 'An error occurred while creating the vault. Please try again.', 'error');
        } finally {
            AddVaultSubmitBtn.innerHTML = originalButtonOriginalContent;
            AddVaultSubmitBtn.disabled = false;
        }
    }


</script>
