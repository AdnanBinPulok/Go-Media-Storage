<section class="rounded-xl border border-white/10 bg-background p-4 md:p-5">
    <div class="flex items-center justify-between gap-3">
        <h2 class="text-base md:text-lg font-heading font-semibold text-text-secondary">File Type Counts</h2>
        <span class="text-xs font-mono text-muted">stored media breakdown</span>
    </div>

    {{ with .status.file_type_counts }}
    <div class="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        {{ range $ext, $count := . }}
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">{{ $ext }}</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">{{ $count }}</p>
        </article>
        {{ end }}
    </div>
    {{ else }}
    <div class="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">.jpg</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">420</p>
        </article>
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">.png</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">315</p>
        </article>
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">.webp</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">188</p>
        </article>
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">.mp4</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">69</p>
        </article>
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">.mp3</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">142</p>
        </article>
        <article class="rounded-lg border border-white/10 bg-secondary px-3 py-2">
            <p class="text-xs font-mono text-muted">other</p>
            <p class="mt-1 text-base font-semibold text-text-secondary">208</p>
        </article>
    </div>
    {{ end }}
</section>
