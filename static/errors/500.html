<head>
    <meta charset="utf-8" />

    <title>Internal Server Error</title>
    <!doctype html>
    <html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Something went wrong</title>
        <style>
            :root {
                --bg: #fff7f7;
                --card: #fff;
                --muted: #475569;
                --accent: #ef4444;
                --glass: rgba(15, 23, 42, 0.04)
            }

            * {
                box-sizing: border-box
            }

            html,
            body {
                height: 100%;
                margin: 0;
                font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
                background: var(--bg);
                color: #0f172a
            }

            .site {
                min-height: 100%;
                display: flex;
                flex-direction: column
            }

            .container {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px
            }

            .panel {
                width: 100%;
                max-width: 760px;
                background: var(--card);
                border-radius: 12px;
                padding: 18px;
                box-shadow: 0 8px 28px var(--glass);
                display: flex;
                gap: 16px;
                align-items: flex-start
            }

            .icon {
                flex: 0 0 58px;
                height: 58px;
                border-radius: 12px;
                background: linear-gradient(135deg, var(--accent), #f97316);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 700
            }

            .content {
                flex: 1
            }

            h1 {
                font-size: 18px;
                margin: 0 0 6px
            }

            p {
                margin: 0;
                color: var(--muted);
                font-size: 14px
            }

            .details {
                margin-top: 12px
            }

            pre {
                background: #fff1f0;
                padding: 10px;
                border-radius: 8px;
                overflow: auto;
                color: #111;
                font-size: 13px;
                max-height: 160px
            }

            .actions {
                margin-top: 14px;
                display: flex;
                gap: 10px
            }

            .btn {
                padding: 10px 14px;
                border-radius: 10px;
                background: #0f172a;
                color: #fff;
                text-decoration: none;
                font-weight: 600;
                font-size: 14px
            }

            footer {
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                color: var(--muted);
                background: transparent
            }

            @media (max-width:560px) {
                .panel {
                    flex-direction: column;
                    align-items: flex-start
                }

                .icon {
                    width: 48px;
                    height: 48px
                }
            }
        </style>
    </head>

<body>
    <div class="site">
        <main class="container">
            <section class="panel" role="main" aria-labelledby="err-title">
                <div class="icon">500</div>
                <div class="content">
                    <h1 id="err-title">Something went wrong</h1>
                    <p>We're having trouble handling your request. Our team has been notified.</p>

                    {{if .ErrorMessage}}
                    <div class="details">
                        <pre>{{.ErrorMessage}}</pre>
                    </div>
                    {{end}}

                    <div class="actions">
                        <a class="btn" href="/">Home</a>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            {{if .IP}}Your IP: {{.IP}}{{end}}
        </footer>
    </div>
</body>

</html>
